<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>@_risewithsk posts</title>
<link href="fonts/fonts.css" rel="stylesheet">
<link href="minimal.css" rel="stylesheet">
</head>
<body>
<script>
// ------------------------------------------------------------------
// Carousel content for @_risewithsk, written from reels on
// @sagarkathrotiyashow. Edit text here; wrap a word in *stars* for italic.
// Use | for a line break.
// Slide types: { h, sub }  or  { cta: true, h, items: [[left, right], ...] }
// ------------------------------------------------------------------
const POSTS = [
  { id: '01-balaji', slides: [
    { h: 'Your competitor is not your *enemy.*', sub: 'A lesson from Chandubhai Virani, founder of Balaji Wafers.' },
    { h: "When Haldiram's factory caught fire, Balaji *helped.*", sub: 'Rivals in the market. Humans first.' },
    { h: 'Competition is *fuel,* not a fight.', sub: 'Use it to improve, innovate and grow.' },
    { h: "Business isn't only profit. It's *respect.*", sub: 'Ethics and humanity build brands that last for generations.' },
    { cta: true, h: 'Watch the full *story.*', items: [['Full episode', 'on @sagarkathrotiyashow'], ['Share it', 'with a founder friend'], ['Follow', '@_risewithsk']] },
  ]},
  { id: '02-savjibhai', slides: [
    { h: "See only the bird's *eye.*", sub: 'The focus lesson from Savjibhai Dholakia.' },
    { h: 'A village boy became a *global* entrepreneur.', sub: 'No shortcut. Just one clear goal.' },
    { h: 'Arjuna saw only the eye. *Nothing* else.', sub: "That's what a clear goal looks like." },
    { h: 'When your vision is strong, distractions *disappear.*', sub: 'When your purpose is clear, success follows.' },
    { h: 'Clarity. Dedication. *Focus.*', sub: 'Non-negotiable if you want something extraordinary.' },
    { cta: true, h: 'Save this for when you lose *focus.*', items: [['Full episode', 'on @sagarkathrotiyashow'], ['Share it', 'with someone distracted'], ['Follow', '@_risewithsk']] },
  ]},
  { id: '03-govindbhai', slides: [
    { h: 'What does *poverty* really look like?', sub: 'A real story shared by Govindbhai Dholakia.' },
    { h: 'No grain to cook. Not even *fuel* to light the stove.', sub: 'That was home.' },
    { h: 'And still, he didn\'t *quit.*', sub: 'He kept his courage. He kept working.' },
    { h: "Hard times don't decide your *ending.*", sub: 'Courage and hard work do.' },
    { cta: true, h: 'Send this to someone going through a *hard* time.', items: [['Full episode', 'on @sagarkathrotiyashow'], ['Share it', 'it might help someone'], ['Follow', '@_risewithsk']] },
  ]},
  { id: '04-tedx', slides: [
    { h: "You can't *prompt* a life.", sub: "From Sagar Kathrotiya's first TEDx talk." },
    { h: 'Two years ago: a podcast and *no* big plan.', sub: 'Just a wish to meet people and learn something new.' },
    { h: '57 emails.|1 big *yes.*', sub: 'Most doors stay closed. You only need one to open.' },
    { h: '100+ conversations. Countless *lessons.*', sub: 'And a journey that led to the TEDx stage.' },
    { h: "You don't need the full map. Take the *next step.*", sub: "That's how every journey starts." },
    { cta: true, h: 'What is your next *step?*', items: [['Comment', 'your next step below'], ['Share it', 'with a dreamer'], ['Follow', '@_risewithsk']] },
  ]},
];

const esc = t => t.replace(/&/g, '&amp;').replace(/</g, '&lt;');
const fmt = t => esc(t).replace(/\*(.+?)\*/g, '<em>$1</em>').replace(/\|/g, '<br>');
const size = t => { const l = t.replace(/\|/g, '').length; return l > 46 ? 'xs' : l > 30 ? 'small' : ''; };
const by = '<div class="by"><div class="avatar">SK</div><div class="by-text">Made by<b>@_risewithsk</b></div></div>';

let html = '';
for (const post of POSTS) {
  const n = post.slides.length;
  post.slides.forEach((s, i) => {
    const num = `${String(i + 1).padStart(2, '0')} / ${String(n).padStart(2, '0')}`;
    const name = `posts/${post.id}/slide-${i + 1}`;
    if (s.cta) {
      html += `<section class="slide" data-name="${name}"><div class="num">${num}</div>
        <div class="content"><h1 class="${size(s.h)}">${fmt(s.h)}</h1></div>
        <div class="list">${s.items.map(([a, b]) => `<div>${esc(a)} <span>${esc(b)}</span></div>`).join('')}</div>
        <div class="footer"><div class="by"><div class="avatar">SK</div><div class="by-text">From Sagar Kathrotiya Show<b>@sagarkathrotiyashow</b></div></div></div>
      </section>`;
    } else {
      html += `<section class="slide" data-name="${name}"><div class="num">${num}</div>
        <div class="content"><h1 class="${size(s.h)}">${fmt(s.h)}</h1></div>
        <p class="sub">${fmt(s.sub)}</p>
        <div class="footer">${by}<div class="toggle"></div></div>
      </section>`;
    }
  });
}
document.write(html);
document.querySelectorAll('.slide').forEach(sl => {
  const g = document.createElement('div'); g.className = 'grid';
  g.innerHTML = '<i></i>'.repeat(6); sl.prepend(g);
});
</script>
</body>
</html>
