<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Mont;font-weight:700;src:url(montserrat-latin-700-normal.woff)}
@font-face{font-family:Fuzzy;font-weight:700;src:url(fuzzy-bubbles-latin-700-normal.woff)}
body{margin:0;width:1080px;height:1350px;background:url(rp_bg.png) center/cover;position:relative;overflow:hidden}
.tint{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 72%,rgba(200,20,30,.35) 100%)}
.logo{position:absolute;top:44px;right:44px;width:200px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.18))}
.head{position:absolute;left:0;right:0;top:170px;text-align:center}
.red{display:inline-block;background:#E21A1A;color:#fff;font-family:Mont;font-weight:700;font-size:74px;line-height:1.02;letter-spacing:1px;padding:26px 46px 30px;border-radius:44px;box-shadow:0 10px 30px rgba(120,0,0,.3)}
.yel{display:inline-block;position:relative;top:-26px;background:#FBF1A6;color:#E21A1A;font-family:Fuzzy;font-weight:700;font-size:118px;line-height:1;padding:6px 44px 22px;border-radius:40px;box-shadow:0 10px 26px rgba(120,60,0,.22)}
</style></head><body><div class="tint"></div><img class="logo" src="logo_red.png">
<div class="head"><div class="red">A FRESH YEAR<br>DESERVES</div><br><div class="yel">Real Play</div></div></body></html>
