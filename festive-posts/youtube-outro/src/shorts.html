@font-face{font-family:Fuzzy;font-weight:700;src:url(fuzzy-bubbles-latin-700-normal.woff)}
@font-face{font-family:Mont;font-weight:700;src:url(montserrat-latin-700-normal.woff)}
body{margin:0;width:1080px;height:1920px;overflow:hidden;position:relative;background:linear-gradient(#E51C1C 0,#E51C1C 1840px,#C71212 1840px)}
.l{position:absolute;opacity:0}
.pop{animation:pop .55s cubic-bezier(.3,1.5,.5,1) forwards}
@keyframes pop{0%{opacity:0;transform:scale(.6)}60%{opacity:1}100%{opacity:1;transform:scale(1)}}
.drop{animation:drop .6s cubic-bezier(.3,1.4,.5,1) forwards}
@keyframes drop{0%{opacity:0;transform:translateY(-60px)}100%{opacity:1;transform:none}}
.fade{animation:fade .5s ease-out forwards}

#mas{animation:rise .6s cubic-bezier(.25,1.3,.5,1) forwards 1.5s}

.dot{position:absolute;border-radius:50%;opacity:0;animation-name:din,drift;animation-fill-mode:forwards,none;animation-iteration-count:1,infinite;animation-timing-function:ease-out,ease-in-out}
@keyframes din{from{opacity:0;transform:scale(0)}to{opacity:.9;transform:scale(1)}}
@keyframes drift{0%,100%{opacity:.9;transform:translateY(0)}50%{opacity:.6;transform:translateY(-20px)}}
.thanks{left:0;right:0;top:110px;text-align:center;font-family:Fuzzy;font-weight:700;font-size:96px;line-height:1.05;color:#fff;text-shadow:0 5px 0 rgba(120,0,0,.35)}
.thanks span{color:#FDD835}
.subwrap{left:0;right:0;top:960px;text-align:center}
#sub{display:inline-flex;align-items:center;gap:22px;background:#fff;color:#E51C1C;font-family:Mont;font-weight:700;font-size:54px;letter-spacing:3px;padding:26px 56px;border-radius:70px;box-shadow:0 10px 26px rgba(100,0,0,.35);animation:tap .5s ease-in-out 3.2s 1 both}
@keyframes tap{0%,100%{transform:scale(1)}40%{transform:scale(.9)}70%{transform:scale(1.06)}}
#hand{left:640px;top:1060px;font-size:90px;opacity:0;animation:hand 1.2s ease-out 2.6s forwards}
@keyframes hand{0%{opacity:0;transform:translate(120px,140px)}50%{opacity:1;transform:translate(0,0)}70%{opacity:1;transform:translate(-6px,-10px) scale(.92)}100%{opacity:0;transform:translate(0,0)}}
