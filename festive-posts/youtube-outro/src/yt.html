<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Fuzzy;font-weight:700;src:url(fuzzy-bubbles-latin-700-normal.woff)}
@font-face{font-family:Mont;font-weight:700;src:url(montserrat-latin-700-normal.woff)}
body{margin:0;width:1920px;height:1080px;overflow:hidden;position:relative;background:linear-gradient(#E51C1C 0,#E51C1C 1010px,#C71212 1010px)}
.l{position:absolute;opacity:0}
.pop{animation:pop .55s cubic-bezier(.3,1.5,.5,1) forwards}
@keyframes pop{0%{opacity:0;transform:scale(.6)}60%{opacity:1}100%{opacity:1;transform:scale(1)}}
.drop{animation:drop .6s cubic-bezier(.3,1.4,.5,1) forwards}
@keyframes drop{0%{opacity:0;transform:translateY(-60px)}100%{opacity:1;transform:none}}
.fade{animation:fade .5s ease-out forwards}
@keyframes fade{0%{opacity:0;transform:translateY(20px)}100%{opacity:1;transform:none}}
#mas{animation:rise .6s cubic-bezier(.25,1.3,.5,1) forwards 1.3s}
@keyframes rise{0%{opacity:0;transform:translateY(300px)}100%{opacity:1;transform:none}}
.dot{position:absolute;border-radius:50%;opacity:0;animation-name:din,drift;animation-fill-mode:forwards,none;animation-iteration-count:1,infinite;animation-timing-function:ease-out,ease-in-out}
@keyframes din{from{opacity:0;transform:scale(0)}to{opacity:.9;transform:scale(1)}}
@keyframes drift{0%,100%{opacity:.9;transform:translateY(0)}50%{opacity:.6;transform:translateY(-14px)}}
.thanks{left:60px;top:50px;width:640px;text-align:center;font-family:Fuzzy;font-weight:700;font-size:62px;line-height:1.05;color:#fff;text-shadow:0 4px 0 rgba(120,0,0,.35)}
.thanks span{color:#FDD835}
.box{position:absolute;border:4px dashed rgba(255,255,255,.85);background:rgba(255,255,255,.12);border-radius:22px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:Mont;font-weight:700;font-size:30px;letter-spacing:3px}
.box b{display:inline-block;width:0;height:0;border-left:34px solid #fff;border-top:22px solid transparent;border-bottom:22px solid transparent;margin-right:20px}
.watch{left:1180px;top:52px;width:680px;text-align:center;font-family:Fuzzy;font-weight:700;font-size:54px;color:#FDD835;text-shadow:0 4px 0 rgba(120,0,0,.35)}
.sub{left:860px;top:70px;width:200px;height:200px;border-radius:50%;border:4px dashed rgba(255,255,255,.9);background:rgba(255,255,255,.12)}
.subbtn{left:810px;top:290px;width:300px;text-align:center}
.subbtn div{display:inline-block;background:#fff;color:#E51C1C;font-family:Mont;font-weight:700;font-size:30px;letter-spacing:2px;padding:14px 34px;border-radius:40px;box-shadow:0 6px 18px rgba(100,0,0,.3)}
