<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:PFD;font-weight:700;src:url(playfair-display-latin-700-normal.woff2)}
@font-face{font-family:Amita;font-weight:700;src:url(amita-devanagari-700-normal.woff2)}
@font-face{font-family:Mont;font-weight:400;src:url(montserrat-latin-400-normal.woff)}
body{margin:0;width:1080px;height:__H__px;overflow:hidden;position:relative;background:#FCF8F2}
.bg{position:absolute;inset:0;background:url(__BG__) center/cover;animation:zoom 8s linear forwards;transform-origin:50% 40%}
@keyframes zoom{from{transform:scale(1.06)}to{transform:scale(1)}}
.glow{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,220,130,.85) 0%,rgba(255,170,60,.35) 35%,rgba(255,140,40,0) 70%);mix-blend-mode:screen;transform:translate(-50%,-50%);animation:flick 1.3s ease-in-out infinite alternate}
@keyframes flick{0%{opacity:.55;transform:translate(-50%,-50%) scale(.92)}35%{opacity:.9;transform:translate(-50%,-52%) scale(1.06)}70%{opacity:.65;transform:translate(-50%,-50%) scale(.97)}100%{opacity:1;transform:translate(-50%,-51%) scale(1.1)}}
.tw{position:absolute;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle,#fff 0%,rgba(255,240,200,.8) 30%,rgba(255,230,180,0) 70%);transform:translate(-50%,-50%);animation:tw 1.6s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.15}to{opacity:1}}
.sp{position:absolute;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle,#FFE9A8,rgba(255,200,80,0) 70%);animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-520px);opacity:0}}
.area{position:absolute;left:0;right:0;top:__T__px;height:__A__px;display:flex;align-items:center;justify-content:center}
.wrap{text-align:center;color:#FFF4E6;transform:scale(__S__)}
.wrap>*{opacity:0;animation:up .9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
.cel{font-family:Mont;font-size:46px;letter-spacing:2px;color:#FFF1E0;display:flex;align-items:center;justify-content:center;gap:12px;animation-delay:.5s!important}
.big{font-family:PFD;font-weight:700;font-size:170px;line-height:1;color:#fff;white-space:nowrap;text-shadow:0 4px 18px rgba(90,0,0,.35);animation:wipe 1.2s cubic-bezier(.3,.6,.2,1) forwards!important;animation-delay:1s!important}
@keyframes wipe{from{opacity:1;clip-path:inset(0 100% 0 0)}to{opacity:1;clip-path:inset(0 -5% 0 0)}}
.fol{font-family:Mont;font-size:44px;color:#FFF1E0;margin-top:14px;animation-delay:2s!important}
.hi{font-family:Amita;font-weight:700;font-size:72px;color:#FFD54F;margin-top:30px;animation-delay:2.6s!important}
.line{font-family:Mont;font-size:32px;line-height:1.45;margin:14px auto 0;max-width:640px;text-wrap:balance;animation-delay:3.3s!important}
.logo{width:190px;margin-top:34px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.25));animation:pop .7s cubic-bezier(.3,1.6,.5,1) forwards!important;animation-delay:4s!important}
@keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
</style></head><body><div class="bg"></div>__FX__
<div class="area"><div class="wrap">
<div class="cel"><svg width="28" height="44" viewBox="0 0 20 32"><path d="M10 1C15 9 18 15 18 21a8 8 0 0 1-16 0C2 15 5 9 10 1z" fill="#FFC107"/><path d="M10 13c3 4 4 7 4 9a4 4 0 0 1-8 0c0-2 1-5 4-9z" fill="#FFF3C4"/></svg>Happy</div>
<div class="big">New Year</div>
<div class="fol">Saal Mubarak</div>
<div class="hi">नूतन वर्षाभिनंदन</div>
<div class="line">Wishing you and your family a year full of new beginnings and joy.</div>
<img class="logo" src="logo.png"></div></div></body></html>
