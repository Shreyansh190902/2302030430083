<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Amita;font-weight:700;src:url(amita-devanagari-700-normal.woff2)}
@font-face{font-family:Tiro;src:url(tiro-devanagari-hindi-devanagari-400-normal.woff2)}
@font-face{font-family:Mont;font-weight:400;src:url(montserrat-latin-400-normal.woff)}
body{margin:0;width:1080px;height:__H__px;overflow:hidden;position:relative;background:#fff}
.bg{position:absolute;inset:0;background:url(__BG__) center/cover;animation:zoom 8s linear forwards;transform-origin:50% 60%}
@keyframes zoom{from{transform:scale(1.05)}to{transform:scale(1)}}
.glow{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,225,140,.9) 0%,rgba(255,170,60,.35) 35%,rgba(255,140,40,0) 70%);mix-blend-mode:screen;transform:translate(-50%,-50%);animation:flick 1.2s ease-in-out infinite alternate}
@keyframes flick{0%{opacity:.55;transform:translate(-50%,-50%) scale(.92)}40%{opacity:.95;transform:translate(-50%,-52%) scale(1.08)}100%{opacity:.7;transform:translate(-50%,-50%) scale(1)}}
.sp{position:absolute;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle,#FFE9A8,rgba(255,200,80,0) 70%);animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-560px);opacity:0}}
.heart{position:absolute;font-size:34px;color:#FFD54F;opacity:0;animation:hrt 4s ease-out infinite}
@keyframes hrt{0%{opacity:0;transform:translateY(0) scale(.6)}20%{opacity:.95}100%{opacity:0;transform:translateY(-260px) scale(1.1)}}
.area{position:absolute;left:0;right:0;top:__T__px;height:__A__px;display:flex;align-items:center;justify-content:center}
.wrap{width:620px;text-align:center;color:#fff;transform:scale(__S__)}
.wrap>*{opacity:0;animation:up .9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
.hs{font-family:Amita;font-weight:700;font-size:96px;line-height:1;color:#FFD54F;margin-bottom:60px;text-shadow:0 2px 8px rgba(90,0,0,.35);animation-delay:.5s!important}
.hb{font-family:Amita;font-weight:700;font-size:200px;line-height:1.15;white-space:nowrap;text-shadow:0 4px 16px rgba(90,0,0,.4);animation:wipe 1.2s cubic-bezier(.3,.6,.2,1) forwards!important;animation-delay:1s!important}
@keyframes wipe{from{opacity:1;clip-path:inset(0 100% 0 0)}to{opacity:1;clip-path:inset(-20% -5% -30% 0)}}
.dv{display:flex;align-items:center;justify-content:center;gap:16px;margin:22px auto 18px;animation-delay:2s!important}
.dv i{display:block;height:2px;width:140px;background:linear-gradient(90deg,transparent,#FFD54F)}
.dv i:last-child{background:linear-gradient(90deg,#FFD54F,transparent)}
.hi{font-family:Tiro;font-size:44px;line-height:1.45;color:#FFE08A;margin-bottom:18px;animation-delay:2.5s!important}
.line{font-family:Mont;font-size:34px;line-height:1.45;text-wrap:balance;animation-delay:3.1s!important}
.logo{width:210px;margin-top:44px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.25));animation:pop .7s cubic-bezier(.3,1.6,.5,1) forwards!important;animation-delay:3.8s!important}
@keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
</style></head><body><div class="bg"></div>__FX__
<div class="area"><div class="wrap">
<div class="hs">शुभ</div><div class="hb">भाई दूज</div>
<div class="dv"><i></i><svg width="40" height="30" viewBox="0 0 34 26"><path d="M17 1c3 4 4 7 0 10-4-3-3-6 0-10z" fill="#FFD54F"/><path d="M2 13h30c-2 7-8 11-15 11S4 20 2 13z" fill="#FFD54F"/></svg><i></i></div>
<div class="hi">भाई-बहन का यह प्यारा रिश्ता<br>हमेशा खुशियों से भरा रहे।</div>
<div class="line">Celebrating the beautiful bond between brothers and sisters.</div>
<img class="logo" src="logo.png"></div></div></body></html>
