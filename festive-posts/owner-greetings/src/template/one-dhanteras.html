<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Amita;font-weight:700;src:url(amita-devanagari-700-normal.woff2)}
@font-face{font-family:Tiro;src:url(tiro-devanagari-hindi-devanagari-400-normal.woff2)}
@font-face{font-family:Mont;font-weight:400;src:url(montserrat-latin-400-normal.woff)}

body{margin:0;width:1080px;height:1920px;background:url(one_bg.png);overflow:hidden;position:relative}
.area{position:absolute;left:0;right:0;top:300px;height:1040px;display:flex;align-items:center;justify-content:center}

.div i:last-child{background:linear-gradient(90deg,#F5C95C,transparent)}
.hi{font-family:Tiro;font-size:44px;line-height:1.45;color:#F9D77E}
.line{font-family:Mont;font-weight:400;font-size:34px;line-height:1.45;margin-top:18px;text-wrap:balance}

<div class="line">Wishing you good health, wealth and happiness this Dhanteras.</div>
