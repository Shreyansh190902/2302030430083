<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Fuzzy;font-weight:700;src:url(fuzzy-bubbles-latin-700-normal.woff)}
@font-face{font-family:Mont;font-weight:700;src:url(montserrat-latin-700-normal.woff)}
body{margin:0;width:1080px;height:1920px;position:relative;overflow:hidden;background:#000}
.bg{position:absolute;inset:0;background:url(__IMG__) center/cover}
.shade{position:absolute;left:0;right:0;bottom:200px;height:820px;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.55) 45%,rgba(0,0,0,.7))}
.txt{position:absolute;left:0;right:0;top:__TOP__px;text-align:center}
.big{display:inline-block;font-family:Mont;font-weight:700;font-size:__SIZE__px;line-height:1;color:#fff;-webkit-text-stroke:8px #111;paint-order:stroke fill;text-shadow:0 10px 0 #111}
.pill{display:inline-block;margin-top:34px;background:#E21A1A;color:#FDD835;font-family:Fuzzy;font-weight:700;font-size:96px;padding:12px 54px 26px;border-radius:70px;box-shadow:0 12px 30px rgba(0,0,0,.45);transform:rotate(-3deg)}
.logo{position:absolute;right:34px;top:270px;width:290px;background:#fff;border-radius:30px;padding:16px 22px;box-shadow:0 10px 28px rgba(0,0,0,.35)}
</style></head><body><div class="bg"></div><div class="shade"></div>
<div class="txt"><div class="big">__L1__</div><br><div class="pill">__L2__</div></div>
<img class="logo" src="logo_red.png"></body></html>
