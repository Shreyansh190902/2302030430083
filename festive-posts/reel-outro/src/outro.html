<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;width:2160px;height:3840px;background:url(L/plate.png);overflow:hidden;position:relative}
.l{position:absolute;opacity:0}
.pop{animation:pop .55s cubic-bezier(.3,1.5,.5,1) forwards}
@keyframes pop{0%{opacity:0;transform:scale(.6)}60%{opacity:1}100%{opacity:1;transform:scale(1)}}
.drop{animation:drop .6s cubic-bezier(.3,1.4,.5,1) forwards}
@keyframes drop{0%{opacity:0;transform:translateY(-120px)}100%{opacity:1;transform:none}}
.fade{animation:fade .5s ease-out forwards}
@keyframes fade{0%{opacity:0;transform:translateY(30px)}100%{opacity:1;transform:none}}
#mas{transform-origin:50% 100%;animation:rise .55s cubic-bezier(.25,1.3,.5,1) forwards 1.25s}
@keyframes rise{0%{opacity:0;transform:translateY(420px) scale(.9)}100%{opacity:1;transform:none}}
@keyframes sway{0%,100%{opacity:1;transform:rotate(0deg) translateY(0)}25%{opacity:1;transform:rotate(-2deg) translateY(-8px)}75%{opacity:1;transform:rotate(2deg) translateY(-8px)}}
#burst{transform-origin:50% 50%;animation:burst .4s ease-out forwards 2.05s, pulse 1s ease-in-out infinite 2.45s}
@keyframes burst{0%{opacity:0;transform:scale(.7)}100%{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.7;transform:scale(1.06)}}
.dot{position:absolute;border-radius:50%;opacity:0;animation-name:din,drift;animation-fill-mode:forwards,none;animation-iteration-count:1,infinite;animation-timing-function:ease-out,ease-in-out}
@keyframes din{from{opacity:0;transform:scale(0)}to{opacity:.9;transform:scale(1)}}
@keyframes drift{0%,100%{opacity:.9;transform:translateY(0)}50%{opacity:.6;transform:translateY(-30px)}}
