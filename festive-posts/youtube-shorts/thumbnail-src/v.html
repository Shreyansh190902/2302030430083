<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Fuzzy;font-weight:700;src:url(fuzzy-bubbles-latin-700-normal.woff)}
@font-face{font-family:Mont;font-weight:700;src:url(montserrat-latin-700-normal.woff)}
body{margin:0;width:1080px;height:1920px;position:relative;overflow:hidden;background:#000}
.p{position:absolute;left:0;width:1080px;height:960px;background-size:cover}
.t1{position:absolute;left:0;right:0;text-align:center;font-family:Mont;font-weight:700;color:#fff;-webkit-text-stroke:6px #111;paint-order:stroke fill;text-shadow:0 8px 0 #111}
.band{position:absolute;left:-20px;right:-20px;top:880px;height:160px;background:#E21A1A;transform:rotate(-3deg);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.band span{font-family:Fuzzy;font-weight:700;font-size:118px;color:#FDD835;text-shadow:0 6px 0 #7a0000}
.logo{position:absolute;right:30px;bottom:40px;width:250px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.4))}
.ep{position:absolute;left:34px;top:200px;background:#FDD835;color:#E21A1A;font-family:Mont;font-weight:700;font-size:40px;padding:10px 26px;border-radius:40px;box-shadow:0 6px 16px rgba(0,0,0,.35)}
</style></head><body>
<div class="p" style="top:0;background-image:url(sad.png)"></div>
<div class="p" style="top:960px;background-image:url(happy.png)"></div>
<div class="t1" style="top:40px;font-size:110px">IT FELL…</div>
<div class="band"><span>TRY AGAIN!</span></div>
<div class="t1" style="top:1745px;left:40px;right:auto;text-align:left;font-size:92px">IT WORKED!</div>
<div class="ep">EP 1</div>
<img class="logo" src="logo_red.png">
</body></html>
