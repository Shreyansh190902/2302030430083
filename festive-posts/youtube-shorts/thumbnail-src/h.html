<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Fuzzy;font-weight:700;src:url(fuzzy-bubbles-latin-700-normal.woff)}
@font-face{font-family:Mont;font-weight:700;src:url(montserrat-latin-700-normal.woff)}
body{margin:0;width:1280px;height:720px;position:relative;overflow:hidden;background:#000}
.p{position:absolute;top:0;width:640px;height:720px;background-size:cover;background-position:center}
.t1{position:absolute;font-family:Mont;font-weight:700;color:#fff;-webkit-text-stroke:5px #111;paint-order:stroke fill;text-shadow:0 6px 0 #111;text-align:center;width:640px}
.mid{position:absolute;left:540px;top:590px;width:440px;height:120px;background:#E21A1A;border-radius:24px;transform:rotate(-4deg);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.mid span{white-space:nowrap;font-family:Fuzzy;font-weight:700;font-size:62px;color:#FDD835;text-shadow:0 4px 0 #7a0000}
.logo{position:absolute;right:20px;bottom:20px;width:170px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.4))}
.div{position:absolute;left:636px;top:0;width:8px;height:720px;background:#fff}
</style></head><body>
<div class="p" style="left:0;background-image:url(sad.png)"></div>
<div class="p" style="left:640px;background-image:url(happy.png)"></div>
<div class="div"></div>
<div class="t1" style="left:0;top:22px;font-size:84px">IT FELL…</div>
<div class="t1" style="left:640px;top:22px;font-size:76px">IT WORKED!</div>
<div class="mid"><span>TRY AGAIN!</span></div>
<img class="logo" src="logo_red.png">
</body></html>
