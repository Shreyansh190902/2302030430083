<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Fuzzy;font-weight:700;src:url(fuzzy-bubbles-latin-700-normal.woff)}
@font-face{font-family:Mont;font-weight:700;src:url(montserrat-latin-700-normal.woff)}
body{margin:0;width:1080px;height:1920px;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 62%,#FF4A3D 0,#E51C1C 45%,#B90F0F 100%)}
.rays{position:absolute;left:50%;top:62%;width:2600px;height:2600px;margin:-1300px 0 0 -1300px;background:repeating-conic-gradient(rgba(255,255,255,.07) 0 8deg,transparent 8deg 16deg)}
.t1{position:absolute;left:0;right:0;top:170px;text-align:center;font-family:Mont;font-weight:700;font-size:150px;line-height:1;color:#fff;text-shadow:0 10px 0 #7a0000}
.t2{position:absolute;left:0;right:0;top:340px;text-align:center;font-family:Fuzzy;font-weight:700;font-size:200px;line-height:1;color:#FDD835;text-shadow:0 10px 0 #7a0000;transform:rotate(-4deg)}
.mas{position:absolute;left:420px;bottom:60px;height:1180px;filter:drop-shadow(0 20px 30px rgba(0,0,0,.35))}
.tower{position:absolute;left:80px;bottom:90px;width:340px}
.tower div{height:118px;margin:0 auto 6px;border-radius:10px;box-shadow:inset 0 -14px 0 rgba(0,0,0,.18),0 8px 14px rgba(0,0,0,.25)}
.logo{position:absolute;left:36px;top:30px;width:230px;background:#fff;border-radius:22px;padding:10px 14px}
.ep{position:absolute;right:36px;top:46px;background:#FDD835;color:#E21A1A;font-family:Mont;font-weight:700;font-size:48px;padding:10px 30px;border-radius:40px}
</style></head><body><div class="rays"></div>
<div class="t1">DON'T</div><div class="t2">give up!</div>
<div class="tower"><div style="width:120px;background:#FDD835"></div><div style="width:170px;background:#F7941D"></div><div style="width:220px;background:#3FA34D"></div><div style="width:270px;background:#2E7BD6"></div><div style="width:330px;background:#F04A3A"></div></div>
<img class="mas" src="mascot.png">
<img class="logo" src="logo_red.png"><div class="ep">EP 1</div>
</body></html>
